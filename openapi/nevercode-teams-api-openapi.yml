components:
  schemas:
    ClassicPagination_api.routes.user.schemas.TeamSchema_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/user_schemas_TeamSchema'
          type: array
        page_size:
          type: integer
        current_page:
          type: integer
        total_pages:
          type: integer
      type: object
      required:
      - current_page
      - data
      - page_size
      - total_pages
      title: ClassicPagination[TeamSchema]
    UpdateAuditLogConnector:
      properties:
        aws_bucket_name:
          type: string
          maxLength: 63
          minLength: 3
        aws_access_key_id:
          type: string
          maxLength: 128
          minLength: 16
        aws_secret_key:
          type: string
          maxLength: 128
          minLength: 16
      type: object
      required:
      - aws_access_key_id
      - aws_bucket_name
      - aws_secret_key
      title: UpdateAuditLogConnector
    NoPagination_api.routes.team_audit_log_connector.schemas.AuditLogConnectorSchema_:
      properties:
        data:
          $ref: '#/components/schemas/AuditLogConnectorSchema'
      type: object
      required:
      - data
      title: NoPagination[AuditLogConnectorSchema]
    user_schemas_TeamSchema:
      properties:
        id:
          type: string
          examples:
          - 60a0b1c2d3e4f56789abcdef
        name:
          type: string
        icon_url:
          oneOf:
          - type: string
          - type: 'null'
      type: object
      required:
      - id
      - name
      title: TeamSchema
    FeaturesSchema:
      properties:
        app_preview:
          oneOf:
          - type: boolean
          - type: 'null'
      type: object
      required: []
      title: FeaturesSchema
    team_schemas_TeamSchema:
      properties:
        name:
          type: string
        icon_url:
          oneOf:
          - type: string
          - type: 'null'
        created_at:
          type: string
          format: date-time
      type: object
      required:
      - created_at
      - name
      title: TeamSchema
    AuditLogConnectorSchema:
      properties:
        enabled:
          type: boolean
        aws_bucket_name:
          oneOf:
          - type: string
          - type: 'null'
        aws_access_key_id:
          oneOf:
          - type: string
          - type: 'null'
        last_sync_result:
          oneOf:
          - type: string
          - type: 'null'
      type: object
      required:
      - enabled
      title: AuditLogConnectorSchema
    NoPagination_api.routes.team.schemas.TeamSchema_:
      properties:
        data:
          $ref: '#/components/schemas/team_schemas_TeamSchema'
      type: object
      required:
      - data
      title: NoPagination[TeamSchema]
  securitySchemes:
    api_key:
      type: apiKey
      name: x-auth-token
      in: header
