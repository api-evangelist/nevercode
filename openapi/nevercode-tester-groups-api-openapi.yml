      summary: Delete contact from the tester group
      operationId: ApiV3TesterGroupsTesterGroupIdContactsContactIdDeleteContact
      parameters:
      - name: tester_group_id
        in: path
        schema:
          type: string
          examples:
          - 60a0b1c2d3e4f56789abcdef
        required: true
        deprecated: false
      - name: contact_id
        in: path
        schema:
          type: string
          examples:
