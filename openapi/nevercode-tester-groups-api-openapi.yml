components:
  schemas:
    ExtraSchema:
      properties:
        limit:
          type: integer
      type: object
      required:
      - limit
      title: ExtraSchema
    UpdateTesterGroup:
      properties:
        name:
          type: string
      type: object
      required:
      - name
      title: UpdateTesterGroup
    PaymentRequiredSchema:
      properties:
        status_code:
          type: integer
        detail:
          type: string
        extra:
          $ref: '#/components/schemas/ExtraSchema'
      type: object
      required:
      - detail
      - extra
      - status_code
      title: PaymentRequiredSchema
    tester_groups_schemas_BulkImportSchema:
      properties:
        emails:
          items:
            type: string
          type: array
          examples:
          - john.doe@example.com
      type: object
      required:
      - emails
      title: BulkImportSchema
    CreateTesterGroup:
      properties:
        name:
          type: string
      type: object
      required:
      - name
      title: CreateTesterGroup
    NoPagination_api.routes.tester_groups.schemas.TesterGroupSchema_:
      properties:
        data:
          $ref: '#/components/schemas/tester_groups_schemas_TesterGroupSchema'
      type: object
      required:
      - data
      title: NoPagination[TesterGroupSchema]
    NoPagination_api.routes.apps.schemas.TesterGroupSchema_:
      properties:
        data:
          $ref: '#/components/schemas/apps_schemas_TesterGroupSchema'
      type: object
      required:
      - data
      title: NoPagination[TesterGroupSchema]
    ClassicPagination_api.routes.tester_groups.schemas.TesterGroupContactSchema_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/TesterGroupContactSchema'
          type: array
        page_size:
          type: integer
        current_page:
          type: integer
        total_pages:
          type: integer
      type: object
      required:
      - current_page
      - data
      - page_size
      - total_pages
      title: ClassicPagination[TesterGroupContactSchema]
    ClassicPagination_api.routes.apps.schemas.TesterGroupSchema_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/apps_schemas_TesterGroupSchema'
          type: array
        page_size:
          type: integer
        current_page:
          type: integer
        total_pages:
          type: integer
      type: object
      required:
      - current_page
      - data
      - page_size
      - total_pages
      title: ClassicPagination[TesterGroupSchema]
    TesterGroupContactSchema:
      properties:
        id:
          type: string
          examples:
          - 60a0b1c2d3e4f56789abcdef
        created_at:
          type: string
          format: date-time
        confirmed_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        status:
          $ref: '#/components/schemas/ContactStatus'
        email:
          type: string
      type: object
      required:
      - created_at
      - email
      - id
      - status
      title: TesterGroupContactSchema
    tester_groups_schemas_TesterGroupSchema:
      properties:
        id:
          type: string
          examples:
          - 60a0b1c2d3e4f56789abcdef
        name:
          type: string
        created_at:
          type: string
          format: date-time
      type: object
      required:
      - created_at
      - id
      - name
      title: TesterGroupSchema
    apps_schemas_TesterGroupSchema:
      properties:
        id:
          type: string
          examples:
          - 60a0b1c2d3e4f56789abcdef
        name:
          type: string
        created_at:
          type: string
          format: date-time
      type: object
      required:
      - created_at
      - id
      - name
      title: TesterGroupSchema
    ContactStatus:
      type: string
      enum:
      - pending
      - confirmed
      - rejected
      title: ContactStatus
  securitySchemes:
    api_key:
      type: apiKey
      name: x-auth-token
      in: header
