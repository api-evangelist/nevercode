components:
  schemas:
    PaymentMethodSchema:
      properties:
        type:
          $ref: '#/components/schemas/PaymentMethodType'
        provider_id:
          type: string
      type: object
      required:
      - provider_id
      - type
      title: PaymentMethodSchema
    InvoicePreviewLineItem:
      properties:
        product_id: {}
        quantity:
          oneOf:
          - type: integer
          - type: 'null'
      type: object
      required:
      - product_id
      title: InvoicePreviewLineItem
    NoPagination_api.routes.team_invoice_preview.schemas.Invoice_:
      properties:
        data:
          $ref: '#/components/schemas/Invoice'
      type: object
      required:
      - data
      title: NoPagination[Invoice]
    ProductSlug:
      type: string
      enum:
      - codepush
      title: ProductSlug
    SubscriptionStatus:
      type: string
      enum:
      - disabled
      - active
      - incomplete
      - incomplete_expired
      - unpaid
      - paused
      - past_due
      - trialing
      - canceled
      title: SubscriptionStatus
    SubscriptionDetailsSchema:
      properties:
        id: {}
        pricing_model:
          $ref: '#/components/schemas/PricingModel'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        category:
          $ref: '#/components/schemas/ProductCategory'
        trial_end_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        default_payment_method:
          oneOf:
          - $ref: '#/components/schemas/PaymentMethodSchema'
          - type: 'null'
        provider_id:
          oneOf:
          - type: string
          - type: 'null'
        created_at:
          type: string
          format: date-time
        current_period_start_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        current_period_end_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        trial_start_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        items:
          oneOf:
          - items:
              $ref: '#/components/schemas/SubscriptionItemSchema'
            type: array
          - type: 'null'
      type: object
      required:
      - category
      - created_at
      - id
      - pricing_model
      - status
      title: SubscriptionDetailsSchema
    NoPagination_list_api.routes.team_subscriptions.schemas.SubscriptionSchema_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/SubscriptionSchema'
          type: array
      type: object
      required:
      - data
      title: NoPagination[list[SubscriptionSchema]]
    CursorPagination_str_api.routes.team_cards.schemas.CardSchema_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CardSchema'
          type: array
        page_size:
          type: integer
        cursor:
          oneOf:
          - type: string
          - type: 'null'
      type: object
      required:
      - data
      - page_size
      title: CursorPagination[str, CardSchema]
    Tax:
      properties:
        description:
          type: string
        percentage:
          type: string
          description: Decimal value serialized as a string to avoid floating-point precision loss.
          examples:
          - '19.99'
        effective_percentage:
          oneOf:
          - type: string
          - type: 'null'
          description: Optional decimal value serialized as a string to avoid floating-point precision loss.
          examples:
          - '19.99'
        amount:
          type: integer
        taxable_amount:
          type: integer
      type: object
      required:
      - amount
      - description
      - effective_percentage
      - percentage
      - taxable_amount
      title: Tax
    team_subscriptions_schemas_InvoiceStatus:
      type: string
      enum:
      - draft
      - open
      - paid
      - uncollectible
      - void
      title: InvoiceStatus
    SubscriptionItemSchema:
      properties:
        provider_id:
          type: string
        created_at:
          type: string
          format: date-time
      type: object
      required:
      - created_at
      - provider_id
      title: SubscriptionItemSchema
    team_invoices_schemas_InvoiceSchema:
      properties:
        provider_id:
          type: string
        status:
          oneOf:
          - $ref: '#/components/schemas/team_invoices_schemas_InvoiceStatus'
          - type: 'null'
        total:
          type: integer
        created_at:
          type: string
          format: date-time
        billing_reason:
          oneOf:
          - type: string
          - type: 'null'
        url:
          oneOf:
          - type: string
          - type: 'null'
      type: object
      required:
      - created_at
      - provider_id
      - total
      title: InvoiceSchema
    CardSchema:
      properties:
        provider_id:
          type: string
        owner:
          $ref: '#/components/schemas/OwnerSchema'
        card:
          $ref: '#/components/schemas/CardDetailsSchema'
      type: object
      required:
      - card
      - owner
      - provider_id
      title: CardSchema
    Invoice:
      properties:
        currency:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        line_items:
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
          type: array
        subtotal:
          type: integer
        discounts:
          items:
            $ref: '#/components/schemas/Discount'
          type: array
        total_excluding_tax:
          type: integer
        taxes:
          items:
            $ref: '#/components/schemas/Tax'
          type: array
        total:
          type: integer
      type: object
      required:
      - currency
      - discounts
      - line_items
      - period_end
      - period_start
      - subtotal
      - taxes
      - total
      - total_excluding_tax
      title: Invoice
    ValidationErrorResponseSchema:
      properties:
        status_code:
          type: integer
        detail:
          type: string
        extra:
          $ref: '#/components/schemas/ValidationErrorExtraSchema'
      type: object
      required:
      - detail
      - extra
      - status_code
      title: ValidationErrorResponseSchema
    CreateSubscriptionProductCategory:
      type: string
      enum:
      - codepush
      title: CreateSubscriptionProductCategory
    Discount:
      properties:
        name:
          oneOf:
          - type: string
          - type: 'null'
        source:
          type: string
        amount:
          type: integer
        amount_off:
          oneOf:
          - type: integer
          - type: 'null'
          description: Amount that will be taken off the subtotal.
        currency:
          oneOf:
          - type: string
          - type: 'null'
          description: Three-letter ISO code for the currency of the amount to take off.
        percent_off:
          oneOf:
          - type: string
          - type: 'null'
          description: Percent that will be taken off the subtotal.
        duration:
          $ref: '#/components/schemas/team_invoice_preview_schemas_DiscountDuration'
        duration_in_months:
          oneOf:
          - type: integer
          - type: 'null'
          description: If duration is repeating, the number of months the coupon applies, null otherwise.
      type: object
      required:
      - amount
      - amount_off
      - currency
      - duration
      - duration_in_months
      - percent_off
      - source
      title: Discount
    GenerateInvoicePreview:
      properties:
        line_items:
          items:
            $ref: '#/components/schemas/InvoicePreviewLineItem'
          type: array
        promotion_code:
          oneOf:
          - type: string
          - type: 'null'
      type: object
      required:
