name: Nevercode
description: Codemagic (built by Nevercode, founded in Estonia) is a continuous integration
  and delivery (CI/CD) platform purpose-built for mobile app teams. It automates building,
  testing, code signing, and releasing apps across Flutter, React Native, native iOS
  and Android, Unity, Ionic, and .NET MAUI, and integrates with GitHub, GitLab, Bitbucket,
  and Azure DevOps. Its REST API (v3) exposes applications, builds, artifacts, teams,
  tester groups, secrets and environment variables, over-the-air updates, app previews,
  and billing so teams can trigger builds and manage their CI/CD pipelines programmatically.
